[package]
name = "qq-codex-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Selective NapCat QQ message archiver with a read-only Codex MCP search server"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
toml = "0.8"
